name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-sites.mjs
      - run: node scripts/test-messaging.mjs
      - run: node scripts/test-prompts.mjs
      - run: node scripts/test-scoring.mjs
      - run: node scripts/test-llm.mjs
      - run: node scripts/test-util.mjs
      - run: node scripts/test-resume-parse.mjs
      - run: node scripts/pack.mjs
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/offerclaw-v*.zip --title "$GITHUB_REF_NAME" --generate-notes
